version: '3.8'

services:
  # MongoDB Database (using external MongoDB Atlas)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: aswan-food-postgres-prod
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-aswan_food_db}
  #     POSTGRES_USER: ${POSTGRES_USER:-aswan_user}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aswan_password}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - aswan-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aswan_user}"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aswan-food-redis-prod
    volumes:
      - redis_data:/data
    networks:
      - aswan-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Server
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aswan-food-api-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL}
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aswan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aswan-food-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aswan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # postgres_data:
  #   driver: local
  redis_data:
    driver: local

networks:
  aswan-network:
    driver: bridge

